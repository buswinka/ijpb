<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-EGCCXG503Y"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-EGCCXG503Y');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | IJPB</title>
  <meta name="description" content="{{ page.description }}">
  <link rel="canonical" href="https://www.imagejpipelinebuilder.com{{ page.url }}">
  <meta property="og:type" content="article">
  <meta property="og:url" content="https://www.imagejpipelinebuilder.com{{ page.url }}">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title }} | IJPB">
  <meta name="twitter:description" content="{{ page.description }}">
  <meta name="twitter:image" content="https://www.imagejpipelinebuilder.com/images/icon.png">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "HowTo",
    "name": "{{ page.title | escape }}",
    "description": "{{ page.description | escape }}",
    "datePublished": "{{ page.date | date: '%Y-%m-%d' }}"
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/images/icon.png">
  <link rel="stylesheet" href="/css/articles.css">

<body style="background:#fff;margin:0;">

<nav class="article-nav">
  <a href="/" class="article-nav-logo">IJPB</a>

     class="article-nav-cta">Download Free</a>
</nav>

<main class="article-body">
  <h1>{{ page.title }}</h1>
  <p class="article-meta">{{ page.date | date: "%B %-d, %Y" }}</p>
  {{ content }}
</main>

<footer class="article-footer">
  <span>&copy; 2026 IJPB &mdash; <a href="/">imagejpipelinebuilder.com</a></span>
  <span>
    <a href="/privacy.html">Privacy</a> &middot;

  </span>
</footer>

</body>
</html>
